name: Android Play Submission Discord

on:
  workflow_run:
    workflows: [Flutter Android Release and Play Closed Test]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Android release run to notify'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: android-discord-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  notify:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify notification safeguards
        run: python3 -m unittest discover -s scripts -p 'test_android_discord.py'
      - name: Restore verified submission and check previous claims
        id: claim
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          mkdir -p .release/android-discord
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > .release/android-discord/run.json
          gh run download "$SOURCE_RUN_ID" --name play-submission-result --dir .release/android-discord
          python3 scripts/android_discord.py verify
          claimed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"android-discord-claim-$SOURCE_RUN_ID\") | .id")
          if [ -n "$claimed" ]; then
            echo 'send=false' >> "$GITHUB_OUTPUT"
            echo 'Notification already claimed; inspect delivery before any manual resend.'
          else
            echo "$SOURCE_RUN_ID" > .release/android-discord/claim.txt
            echo 'send=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.claim.outputs.send == 'true'
        with:
          name: android-discord-claim-${{ env.SOURCE_RUN_ID }}
          path: .release/android-discord/claim.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Notify Discord of Play submission
        if: steps.claim.outputs.send == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 scripts/android_discord.py send
