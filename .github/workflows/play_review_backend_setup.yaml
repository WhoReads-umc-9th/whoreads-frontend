name: Provision Backend Play Review Credentials

on:
  workflow_dispatch:
    inputs:
      backend_public_key:
        required: true
        type: string
      backend_key_id:
        required: true
        type: string
      frontend_public_key:
        required: true
        type: string
      frontend_key_id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyNaCl
      - name: Seal runtime credentials for the destination repositories
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BACKEND_PUBLIC_KEY: ${{ inputs.backend_public_key }}
          BACKEND_KEY_ID: ${{ inputs.backend_key_id }}
          FRONTEND_PUBLIC_KEY: ${{ inputs.frontend_public_key }}
          FRONTEND_KEY_ID: ${{ inputs.frontend_key_id }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, secrets
          from nacl.public import PublicKey, SealedBox
          from nacl.encoding import Base64Encoder
          account = json.loads(os.environ['PLAY_SERVICE_ACCOUNT_JSON'])
          assert account.get('type') == 'service_account'
          assert os.environ['DISCORD_WEBHOOK_URL'].startswith('https://discord.com/api/webhooks/')
          token = secrets.token_urlsafe(48)
          credentials = [
              ('backend', 'PLAY_REVIEW_SERVICE_ACCOUNT_BASE64', base64.b64encode(os.environ['PLAY_SERVICE_ACCOUNT_JSON'].encode()).decode()),
              ('backend', 'DISCORD_WEBHOOK_URL', os.environ['DISCORD_WEBHOOK_URL']),
              ('backend', 'PLAY_REVIEW_MONITOR_TOKEN', token),
              ('frontend', 'PLAY_REVIEW_MONITOR_TOKEN', token),
          ]
          sealed = []
          for destination, name, value in credentials:
              prefix = destination.upper()
              key = PublicKey(os.environ[prefix + '_PUBLIC_KEY'], encoder=Base64Encoder)
              ciphertext = base64.b64encode(SealedBox(key).encrypt(value.encode())).decode()
              sealed.append({'repository': 'WhoReads-umc-9th/whoreads-' + destination,
                             'name': name, 'key_id': os.environ[prefix + '_KEY_ID'], 'encrypted_value': ciphertext})
          pathlib.Path('sealed-runtime-credentials.json').write_text(json.dumps(sealed))
          print('Sealed four credentials; no plaintext credentials are written to disk.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-runtime-credentials
          path: sealed-runtime-credentials.json
          retention-days: 1
          if-no-files-found: error
