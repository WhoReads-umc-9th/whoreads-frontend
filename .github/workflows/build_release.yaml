name: Flutter Android Release and Play Closed Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Serialize version allocation and publishing; do not cancel uploads in progress.
concurrency:
  group: whoreads-play-main
  cancel-in-progress: false

env:
  FASTLANE_SKIP_UPDATE_CHECK: "true"
  FASTLANE_HIDE_CHANGELOG: "true"
  FASTLANE_OPT_OUT_USAGE: "true"

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      version_name: ${{ steps.plan.outputs.version_name }}
      version_code: ${{ steps.plan.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Verify deployment safeguards
        run: |
          bundle exec ruby fastlane/play_release_test.rb
          python3 scripts/test_register_play_review.py
      - name: Plan release against all uploaded Play versions
        id: plan
        env:
          PLAY_AUTO_DEPLOY: ${{ vars.PLAY_AUTO_DEPLOY }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android prepare
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: .release/plan.json
          include-hidden-files: true
          if-no-files-found: error

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # FCM 구글 서비스 JSON 파일 생성
      - name: Restore Android release inputs
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: python3 scripts/android_release_inputs.py

      - name: Create Real .env File
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: python3 scripts/release_config.py write-env

      - name: Verify deployed Kakao authorization endpoint
        run: python3 scripts/release_config.py verify-server .env

      # 6. 의존성 패키지 다운로드 및 캐시 정리
      - name: Install dependencies
        run: |
          flutter pub get
          flutter test --no-pub

      # 7. 앱 번들(AAB) 빌드
      - name: Build Android App Bundle (Release)
        env:
          RELEASE_VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: flutter build appbundle --release --no-tree-shake-icons --build-name="$RELEASE_VERSION_NAME" --build-number="$RELEASE_VERSION_CODE"

      - name: Build Android APK (Release)
        env:
          RELEASE_VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: flutter build apk --release --no-tree-shake-icons --build-name="$RELEASE_VERSION_NAME" --build-number="$RELEASE_VERSION_CODE"

      - name: Validate key-free app configuration
        run: |
          python3 scripts/release_config.py audit build/app/outputs/bundle/release/app-release.aab
          python3 scripts/release_config.py audit build/app/outputs/flutter-apk/app-release.apk

      - name: Record audited artifact provenance
        env:
          RELEASE_VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          mkdir -p .release/artifacts
          cp build/app/outputs/bundle/release/app-release.aab .release/artifacts/
          cp build/app/outputs/flutter-apk/app-release.apk .release/artifacts/
          aapt2_path=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          ruby fastlane/play_release.rb manifest .release/artifacts "$RELEASE_VERSION_NAME" "$RELEASE_VERSION_CODE" "$GITHUB_SHA" "$aapt2_path"

      # 8. 업로드 단계에서 APK 경로도 같이 포함시키기
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          if-no-files-found: error
          include-hidden-files: true
          path: .release/artifacts/*

      - name: Report build and deployment mode
        env:
          PLAY_DEPLOY: ${{ needs.prepare.outputs.deploy }}
          RELEASE_VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          echo "Built WhoReads $RELEASE_VERSION_NAME+$RELEASE_VERSION_CODE from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PLAY_DEPLOY" != true ]; then
            echo "Play upload is disabled. Add PLAY_SERVICE_ACCOUNT_JSON and set PLAY_AUTO_DEPLOY=true to enable it." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove temporary build credentials
        if: always()
        run: rm -f .env android/key.properties android/app/key.jks android/app/google-services.json ios/Flutter/Kakao.xcconfig

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: app-release
          path: .release/artifacts
      - name: Reject stale main commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          test "$latest_sha" = "$GITHUB_SHA" || { echo "Newer main commit exists; refusing to publish an older build."; exit 1; }
      - name: Recheck artifact integrity and live Kakao server
        run: |
          ruby fastlane/play_release.rb verify .release/artifacts "$GITHUB_SHA"
          python3 scripts/release_config.py verify-server .release/artifacts/app-release.aab
          python3 scripts/release_config.py audit .release/artifacts/app-release.apk
      - name: Submit to existing Alpha closed test
        env:
          PLAY_AUTO_DEPLOY: ${{ vars.PLAY_AUTO_DEPLOY }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_ARTIFACT_DIR: ${{ github.workspace }}/.release/artifacts
        run: bundle exec fastlane android closed_test
      - name: Record Play submission result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-submission-result
          path: .release/artifacts/play-result.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Start backend review monitoring for the submitted version
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          PLAY_REVIEW_MONITOR_TOKEN: ${{ secrets.PLAY_REVIEW_MONITOR_TOKEN }}
        run: python3 scripts/register_play_review.py .release/artifacts/play-result.json
      - name: Report submission
        env:
          RELEASE_VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          echo "Submitted WhoReads $RELEASE_VERSION_NAME+$RELEASE_VERSION_CODE to the existing Alpha closed-test track." >> "$GITHUB_STEP_SUMMARY"
          echo "Google review approval and tester availability are not confirmed by this job." >> "$GITHUB_STEP_SUMMARY"
