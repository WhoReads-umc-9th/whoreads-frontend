name: Flutter Android Bundle Release Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # FCM 구글 서비스 JSON 파일 생성
      - name: Create google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Create Real .env File
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}" > ./.env
      # 5. key.jks 복원 및 key.properties 자동 생성
      - name: Configure Keystore & Properties
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=../app/key.jks" >> android/key.properties

      # 6. 의존성 패키지 다운로드 및 캐시 정리
      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get

      # 7. 앱 번들(AAB) 빌드
      - name: Build Android App Bundle (Release)
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Build Android APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      # 8. 업로드 단계에서 APK 경로도 같이 포함시키기
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
