name: Flutter Android Bundle Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # FCM 구글 서비스 JSON 파일 생성
      - name: Restore Android release inputs
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: python3 scripts/android_release_inputs.py

      - name: Create Real .env File
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: python3 scripts/release_config.py write-env

      # 6. 의존성 패키지 다운로드 및 캐시 정리
      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get

      # 7. 앱 번들(AAB) 빌드
      - name: Build Android App Bundle (Release)
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Build Android APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Validate key-free app configuration
        run: |
          python3 scripts/release_config.py audit build/app/outputs/bundle/release/app-release.aab
          python3 scripts/release_config.py audit build/app/outputs/flutter-apk/app-release.apk

      # 8. 업로드 단계에서 APK 경로도 같이 포함시키기
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          if-no-files-found: error
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

      - name: Remove temporary build credentials
        if: always()
        run: rm -f .env android/key.properties android/app/key.jks android/app/google-services.json ios/Flutter/Kakao.xcconfig
