name: Verify Backend Play Review Scheduler

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: 'Successful Play submission run to verify'
        type: string
        required: true
      prior_message_id:
        description: 'Import an already delivered completion notification to prevent duplicates'
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: play-submission-result
          path: .release/backend-verify
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
      - name: Verify real backend scheduler and labelled Discord test delivery
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          PLAY_REVIEW_MONITOR_TOKEN: ${{ secrets.PLAY_REVIEW_MONITOR_TOKEN }}
          PLAY_REVIEW_PRIOR_MESSAGE_ID: ${{ inputs.prior_message_id }}
        run: python3 scripts/register_play_review.py .release/backend-verify/play-result.json --probe
